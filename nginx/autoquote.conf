server {
    listen 127.0.0.1:8080;
    server_name localhost;

    # Current active backend slot.
    # Updated automatically by scripts/deploy.sh.
    add_header X-Active-Slot blue always;

    # Block public access to staged frontend releases.
    location ^~ /.releases/ {
        deny all;
    }

    # React production frontend
    root /var/www/autoquote;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI backend routes
    location ~ ^/(quotes|healthz)(/|$) {
        proxy_pass http://127.0.0.1:8004;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
