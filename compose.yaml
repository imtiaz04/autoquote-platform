services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    networks:
      - autoquote

  nginx:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - autoquote

networks:
  autoquote:
