name: AutoQuote Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping production deployments.
concurrency:
  group: autoquote-production
  cancel-in-progress: false

jobs:
  # ==========================================
  # FRONTEND CI - VALIDATE AND BUILD REACT
  # ==========================================

  frontend:
    name: "1. Frontend - Lint and Production Build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build React Frontend
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoquote-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1


  # ==========================================
  # JOB 1: VALIDATE DEPENDENCIES
  # ==========================================

  validate:
    name: "2. Validate Dependencies"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Dependencies
        run: python -m pip check

  # ==========================================
  # JOB 2: AUTOMATED TESTING
  # ==========================================

  test:
    name: "3. Run Automated Tests"
    needs: validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Automated Tests
        run: python -m pytest -v

  # ==========================================
  # JOB 3: BUILD DOCKER IMAGE
  # ==========================================

  build:
    name: "4. Build Docker Image"
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t autoquote-backend:${{ github.sha }} \
            ./backend

      - name: Verify Non-Root User
        run: |
          USER_ID=$(docker run --rm \
            --entrypoint id \
            autoquote-backend:${{ github.sha }} -u)

          echo "Container UID: $USER_ID"
          test "$USER_ID" != "0"

      - name: Save Docker Image
        run: |
          docker save \
            -o /tmp/autoquote-backend.tar \
            autoquote-backend:${{ github.sha }}

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoquote-backend-image
          path: /tmp/autoquote-backend.tar
          retention-days: 1
          if-no-files-found: error

  # ==========================================
  # JOB 4: TRIVY SECURITY SCAN
  # ==========================================

  security:
    name: "5. Trivy Security Scan"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: autoquote-backend-image
          path: /tmp/autoquote-image

      - name: Load Docker Image
        run: |
          docker load \
            -i /tmp/autoquote-image/autoquote-backend.tar

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autoquote-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # JOB 5: PUBLISH IMAGE TO GHCR
  # ==========================================

  publish:
    name: "6. Publish Docker Image to GHCR"
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Scanned Docker Image
        uses: actions/download-artifact@v4
        with:
          name: autoquote-backend-image
          path: /tmp/autoquote-image

      - name: Load Scanned Docker Image
        run: |
          docker load \
            -i /tmp/autoquote-image/autoquote-backend.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker Image for GHCR
        run: |
          docker tag \
            autoquote-backend:${{ github.sha }} \
            ghcr.io/imtiaz04/autoquote-backend:${{ github.sha }}

      - name: Push Docker Image to GHCR
        run: |
          docker push \
            ghcr.io/imtiaz04/autoquote-backend:${{ github.sha }}

      - name: Display Published Image
        run: |
          echo "Published Docker image:"
          echo "ghcr.io/imtiaz04/autoquote-backend:${{ github.sha }}"

  # ==========================================
  # JOB 6: BLUE-GREEN DEPLOYMENT
  # ==========================================

  deploy:
    name: "7. Blue-Green Deployment Validation"
    needs: [publish, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Tested Commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download React Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: autoquote-frontend
          path: frontend/dist

      - name: Initialize NGINX
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y nginx

          sudo mkdir -p /var/www/autoquote
          sudo cp -a frontend/dist/. /var/www/autoquote/

          sudo rm -f /etc/nginx/sites-enabled/default
          sudo rm -f /etc/nginx/sites-enabled/autoquote.conf

          sudo ln -s "$GITHUB_WORKSPACE/nginx/autoquote.conf" \
            /etc/nginx/sites-enabled/autoquote.conf

          sudo nginx -t
          sudo systemctl enable --now nginx

      - name: Initialize Blue Backend
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker pull "ghcr.io/imtiaz04/autoquote-backend:${DEPLOY_SHA}"

          docker run -d \
            --name autoquote-blue \
            -p 127.0.0.1:8004:8000 \
            "ghcr.io/imtiaz04/autoquote-backend:${DEPLOY_SHA}"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:8004/healthz | \
              grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
              echo "Blue backend is healthy."
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              docker logs autoquote-blue
              exit 1
            fi

            sleep 5
          done

          curl --fail --silent --show-error -D - -o /dev/null \
            http://127.0.0.1:8080/healthz | \
            grep -Eiq '^X-Active-Slot:[[:space:]]*blue[[:space:]]*\r?$'

      - name: Execute Blue-Green Deployment
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
          AUTOQUOTE_NGINX_CONFIG: ${{ github.workspace }}/nginx/autoquote.conf
        run: |
          set -euo pipefail
          bash scripts/deploy.sh "$DEPLOY_SHA"

      - name: Verify Blue-Green Traffic Switch
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/ | \
            grep -q 'id="root"'

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/healthz | \
            grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'

          curl --fail --silent --show-error -D - -o /dev/null \
            http://127.0.0.1:8080/healthz | \
            grep -Eiq '^X-Active-Slot:[[:space:]]*green[[:space:]]*\r?$'

          for container in autoquote-blue autoquote-green; do
            STATUS=$(docker inspect \
              -f '{{.State.Health.Status}}' "$container")

            echo "$container: $STATUS"
            test "$STATUS" = healthy
          done

          for container in autoquote-blue-backup autoquote-green-backup; do
            if docker container inspect "$container" >/dev/null 2>&1; then
              echo "Unexpected backup container: $container"
              exit 1
            fi
          done

          echo "Blue-Green traffic switching verified."

  # ==========================================
  # JOB 8: DOCKER COMPOSE END-TO-END VALIDATION
  # ==========================================

  verify:
    name: "8. Docker Compose and End-to-End Verification"
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Tested Commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and Start Docker Compose Application
        shell: bash
        run: |
          set -euo pipefail

          docker compose up -d --build --wait
          docker compose ps

      - name: Verify Frontend and Backend
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            http://127.0.0.1:8081/ | \
            grep -q 'id="root"'

          curl --fail --silent --show-error \
            http://127.0.0.1:8081/healthz | \
            grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'

      - name: Verify Insurance Quote Comparison
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"driver_age":30,"zip_code":"08830","vehicle_year":2022,"vehicle_make":"Toyota","vehicle_model":"Camry","coverage_type":"full"}' \
            http://127.0.0.1:8081/quotes/compare \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data); assert data'

          echo "End-to-end quote comparison verified."

      - name: Show Container Logs on Failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Stop Temporary Docker Compose Application
        if: always()
        run: docker compose down --remove-orphans
