name: AutoQuote Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: VALIDATE DEPENDENCIES
  # ==========================================

  validate:
    name: "1. Validate Dependencies"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Dependencies
        run: python -m pip check

  # ==========================================
  # JOB 2: AUTOMATED TESTING
  # ==========================================

  test:
    name: "2. Run Automated Tests"
    needs: validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Automated Tests
        run: python -m pytest -v

  # ==========================================
  # JOB 3: BUILD AND SECURITY SCAN
  # ==========================================

  build:
    name: "3. Build and Scan Docker Image"
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t autoquote-backend:${{ github.sha }} \
            ./backend

      - name: Verify Non-Root User
        run: |
          USER_ID=$(docker run --rm \
            --entrypoint id \
            autoquote-backend:${{ github.sha }} -u)

          echo "Container UID: $USER_ID"
          test "$USER_ID" != "0"

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autoquote-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Save Scanned Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save \
            -o /tmp/autoquote-backend.tar \
            autoquote-backend:${{ github.sha }}

      - name: Upload Docker Image Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: autoquote-backend-image
          path: /tmp/autoquote-backend.tar
          retention-days: 1
          if-no-files-found: error

  # ==========================================
  # JOB 4: PUBLISH TO GHCR
  # ==========================================

  publish:
    name: "4. Publish Docker Image to GHCR"
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Scanned Docker Image
        uses: actions/download-artifact@v4
        with:
          name: autoquote-backend-image
          path: /tmp/autoquote-image

      - name: Load Scanned Docker Image
        run: |
          docker load \
            -i /tmp/autoquote-image/autoquote-backend.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker Image for GHCR
        run: |
          docker tag \
            autoquote-backend:${{ github.sha }} \
            ghcr.io/imtiaz04/autoquote-backend:${{ github.sha }}

      - name: Push Docker Image to GHCR
        run: |
          docker push \
            ghcr.io/imtiaz04/autoquote-backend:${{ github.sha }}

      - name: Display Published Image
        run: |
          echo "Published Docker image:"
          echo "ghcr.io/imtiaz04/autoquote-backend:${{ github.sha }}"