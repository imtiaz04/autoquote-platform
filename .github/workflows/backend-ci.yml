name: AutoQuote Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping production deployments.
concurrency:
  group: autoquote-production
  cancel-in-progress: false

jobs:
  # ==========================================
  # FRONTEND CI - VALIDATE AND BUILD REACT
  # ==========================================

  frontend:
    name: "Frontend - Lint and Production Build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build React Frontend
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoquote-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1


  # ==========================================
  # JOB 1: VALIDATE DEPENDENCIES
  # ==========================================

  validate:
    name: "1. Validate Dependencies"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Dependencies
        run: python -m pip check

  # ==========================================
  # JOB 2: AUTOMATED TESTING
  # ==========================================

  test:
    name: "2. Run Automated Tests"
    needs: validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Automated Tests
        run: python -m pytest -v

  # ==========================================
  # JOB 3: BUILD DOCKER IMAGE
  # ==========================================

  build:
    name: "3. Build Docker Image"
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t autoquote-backend:${{ github.sha }} \
            ./backend

      - name: Verify Non-Root User
        run: |
          USER_ID=$(docker run --rm \
            --entrypoint id \
            autoquote-backend:${{ github.sha }} -u)

          echo "Container UID: $USER_ID"
          test "$USER_ID" != "0"

      - name: Save Docker Image
        run: |
          docker save \
            -o /tmp/autoquote-backend.tar \
            autoquote-backend:${{ github.sha }}

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoquote-backend-image
          path: /tmp/autoquote-backend.tar
          retention-days: 1
          if-no-files-found: error

  # ==========================================
  # JOB 4: TRIVY SECURITY SCAN
  # ==========================================

  security:
    name: "4. Trivy Security Scan"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: autoquote-backend-image
          path: /tmp/autoquote-image

      - name: Load Docker Image
        run: |
          docker load \
            -i /tmp/autoquote-image/autoquote-backend.tar

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autoquote-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # JOB 5: PUBLISH IMAGE TO GHCR
  # ==========================================

  publish:
    name: "5. Publish Docker Image to GHCR"
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Scanned Docker Image
        uses: actions/download-artifact@v4
        with:
          name: autoquote-backend-image
          path: /tmp/autoquote-image

      - name: Load Scanned Docker Image
        run: |
          docker load \
            -i /tmp/autoquote-image/autoquote-backend.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker Image for GHCR
        run: |
          docker tag \
            autoquote-backend:${{ github.sha }} \
            ghcr.io/imtiaz04/autoquote-backend:${{ github.sha }}

      - name: Push Docker Image to GHCR
        run: |
          docker push \
            ghcr.io/imtiaz04/autoquote-backend:${{ github.sha }}

      - name: Display Published Image
        run: |
          echo "Published Docker image:"
          echo "ghcr.io/imtiaz04/autoquote-backend:${{ github.sha }}"

  # ==========================================
  # JOB 6: BLUE-GREEN DEPLOYMENT
  # ==========================================

  deploy:
    name: "6. Blue-Green Deployment"
    needs: [publish, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, autoquote-deploy]

    timeout-minutes: 15

    steps:
      - name: Checkout Tested Commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download React Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: autoquote-frontend
          path: frontend/dist

      - name: Verify Deployment Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner: $(hostname)"
          echo "User: $(whoami)"

          docker info >/dev/null
          sudo -n /usr/sbin/nginx -t

          test -f /home/imtiaz/Documents/autoquote-platform/nginx/autoquote.conf

      - name: Execute Blue-Green Deployment
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
          AUTOQUOTE_NGINX_CONFIG: /home/imtiaz/Documents/autoquote-platform/nginx/autoquote.conf
        run: |
          set -euo pipefail

          bash scripts/deploy.sh "$DEPLOY_SHA"

      - name: Deploy React Frontend to NGINX
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying React frontend..."

          test -f frontend/dist/index.html
          test -d /var/www/autoquote

          cp -a frontend/dist/. /var/www/autoquote/

          test -f /var/www/autoquote/index.html

          echo "React frontend deployed successfully."

  # ==========================================
  # JOB 7: POST-DEPLOYMENT VERIFICATION
  # ==========================================

  verify:
    name: "7. Post-Deployment Health Verification"
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, autoquote-deploy]

    timeout-minutes: 5

    steps:
      - name: Verify React Frontend
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying React frontend..."

          test -f /var/www/autoquote/index.html

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/ \
            | grep -q 'id="root"'

          echo "React frontend verification passed."

      - name: Verify NGINX Health
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/healthz \
            | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'

          echo "NGINX health verification passed."

      - name: Verify Active Deployment Slot
        shell: bash
        run: |
          set -euo pipefail

          HEADERS=$(curl --fail --silent --show-error \
            -D - -o /dev/null \
            http://127.0.0.1:8080/healthz)

          echo "$HEADERS"

          echo "$HEADERS" |
            grep -Eiq '^X-Active-Slot:[[:space:]]*(blue|green)[[:space:]]*\r?$'

          echo "Active deployment slot verified."

      - name: Verify Blue and Green Containers
        shell: bash
        run: |
          set -euo pipefail

          for CONTAINER in autoquote-blue autoquote-green; do
            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              "$CONTAINER")

            echo "$CONTAINER: $STATUS"

            test "$STATUS" = "healthy"
          done

          echo "Both blue-green containers are healthy."

      - name: Verify No Temporary Backups Remain
        shell: bash
        run: |
          set -euo pipefail

          for CONTAINER in autoquote-blue-backup autoquote-green-backup; do
            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              echo "Unexpected backup container remains: $CONTAINER"
              exit 1
            fi
          done

          echo "No temporary deployment backups remain."

      - name: Display Deployment Summary
        shell: bash
        run: |
          echo "AutoQuote deployment verification completed."
          echo "Commit: ${{ github.sha }}"
          docker ps \
            --filter "name=autoquote-blue" \
            --filter "name=autoquote-green" \
            --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"