<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 340"
     fill="none">

  <defs>
    <linearGradient id="shieldGradient"
                    x1="50" y1="30"
                    x2="250" y2="300"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Soft shadow -->
  <ellipse cx="150" cy="320" rx="95" ry="12"
           fill="#7C3AED" opacity="0.12"/>

  <!-- Shield body -->
  <path d="M150 20
           L260 65
           V155
           C260 225 220 275 150 310
           C80 275 40 225 40 155
           V65 Z"
        fill="url(#shieldGradient)"
        stroke="#4C1D95"
        stroke-width="7"
        stroke-linejoin="round"/>

  <!-- Inner border -->
  <path d="M150 48
           L235 82
           V155
           C235 208 205 250 150 280
           C95 250 65 208 65 155
           V82 Z"
        stroke="#DDD6FE"
        stroke-width="4"
        opacity="0.7"/>

  <!-- White checkmark -->
  <path d="M105 160
           L140 195
           L205 125"
        stroke="white"
        stroke-width="17"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</svg>
